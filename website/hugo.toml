# ABOUTME: Hugo configuration for the Dockyard website.
# ABOUTME: Multi-language site deployed to francesc.barnola.net via GitHub Pages.

baseURL = "https://francesc.barnola.net"
title = "Dockyard"
defaultContentLanguage = "en"

[languages.en]
  languageCode = "en"
  languageName = "English"
  weight = 1
  contentDir = "content"

[languages.ca]
  languageCode = "ca"
  languageName = "Catala"
  weight = 2
  contentDir = "content/ca"

[languages.es]
  languageCode = "es"
  languageName = "Espanol"
  weight = 3
  contentDir = "content/es"

[languages.sv]
  languageCode = "sv"
  languageName = "Svenska"
  weight = 4
  contentDir = "content/sv"

[languages.de]
  languageCode = "de"
  languageName = "Deutsch"
  weight = 5
  contentDir = "content/de"

[params]
  description = "A native macOS app that manages git worktrees, coding agent sessions, and dev servers from a single window."
  ogImage = "/img/og-image.png"
  githubURL = "https://github.com/barnolacesc/dockyard"
  downloadURL = "https://github.com/barnolacesc/dockyard/releases/latest/download/Dockyard.dmg"
  analyticsID = "81a482e5-52a9-467e-87f8-28c38f2d7e9e"
  analyticsSrc = "https://meta.francesc.barnola.net/meta.js"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"

[markup.goldmark.parser.attribute]
  block = true
  title = true

[markup.goldmark.renderer]
  unsafe = true


[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
